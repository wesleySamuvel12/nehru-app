version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: school_erp_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - school_erp_network

  grafana:
    image: grafana/grafana:latest
    container_name: school_erp_grafana
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - school_erp_network

networks:
  school_erp_network:
    external: true

volumes:
  grafana_data:
