events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream backend_upstream {
    server backend:4000;
  }

  upstream admin_web_upstream {
    server admin-web:3000;
  }

  upstream teacher_web_upstream {
    server teacher-web:3000;
  }

  upstream student_web_upstream {
    server student-web:3000;
  }

  upstream parent_web_upstream {
    server parent-web:3000;
  }

  server {
    listen 80;
    server_name localhost;

    # API Gateway
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Admin Portal
    location /admin/ {
      proxy_pass http://admin_web_upstream/;
      proxy_set_header Host $host;
    }

    # Teacher Portal
    location /teacher/ {
      proxy_pass http://teacher_web_upstream/;
      proxy_set_header Host $host;
    }

    # Student Portal
    location /student/ {
      proxy_pass http://student_web_upstream/;
      proxy_set_header Host $host;
    }

    # Parent Portal
    location /parent/ {
      proxy_pass http://parent_web_upstream/;
      proxy_set_header Host $host;
    }

    # Default fallback to Admin
    location / {
      proxy_pass http://admin_web_upstream;
      proxy_set_header Host $host;
    }
  }
}
