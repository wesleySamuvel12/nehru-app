services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nehru_erp_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nehru_erp}:${POSTGRES_PASSWORD:-nehru_erp_dev_secret_change_in_prod}@postgres:5432/${POSTGRES_DB:-nehru_erp}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nehru_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nehru_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nehru_erp_dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-nehru_erp}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nehru_erp} -d $${POSTGRES_DB:-nehru_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: nehru_erp_postgres_data
